name: Update ESG data daily
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update esg_data.js
        run: python update_esg.py
      - name: Commit changes
        run: |
          git config user.name "esg-bot"
          git config user.email "esg-bot@users.noreply.github.com"
          git add esg_data.js
          git commit -m "Auto update ESG data" || echo "no changes"
          git push
