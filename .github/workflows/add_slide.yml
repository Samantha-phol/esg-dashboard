name: Add presentation slide
on: workflow_dispatch
permissions:
  contents: write
jobs:
  add-slide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download slide from Google Drive
        run: |
          curl -L -o "Presentation ESG Dashboard.pdf" "https://drive.usercontent.google.com/download?id=1OkS_guzPpqt32oFK9P78es5UTuMC-oKP&export=download&confirm=t"
          head -c 4 "Presentation ESG Dashboard.pdf" | grep -q PDF
      - name: Commit and push
        run: |
          git config user.name "esg-bot"
          git config user.email "esg-bot@users.noreply.github.com"
          git add "Presentation ESG Dashboard.pdf"
          git commit -m "Add ESG presentation slide"
          git push
